<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cardápio Cultiva</title>
<meta name="description" content="Cardápio da Cerveja Artesanal Cultiva: chopes, porções, Pit Smoker Mad Max e bebidas.">
<meta name="theme-color" content="#472536">
<link rel="preload" href="/fonts/milho-cozido.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/montserrat-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/cardapio.css">
</head>
<body>
<nav class="nav" aria-label="Seções do cardápio"><ul></ul></nav>
<main class="folhas"><p class="estado">Carregando cardápio…</p></main>
<script src="/cardapio.js"></script>
<script>
(async () => {
  const pdf = new URLSearchParams(location.search).get('modo') === 'pdf';
  if (pdf) {
    // Usado pelo painel para gerar o PDF: os dados chegam do painel.
    document.documentElement.classList.add('modo-pdf');
    window.CardapioPronto = true;
    return;
  }
  try {
    Cardapio.render(await Cardapio.carregarDados());
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  } catch (e) {
    document.querySelector('.folhas').innerHTML = '<p class="estado">Não foi possível carregar o cardápio. Tente novamente em instantes.</p>';
  }
})();
</script>
</body>
</html>
